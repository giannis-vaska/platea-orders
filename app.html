<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#16213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Platea">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Τραπέζια · Platea Orders</title>
<style>
  :root { --night:#16213a; --paper:#f6f7f4; --ink:#1b1f2a; --muted:#5e6573; --red:#c8302b; --line:#cfd3da; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 12px 12px 110px; background: var(--night); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; background: var(--paper); border-radius: 6px; min-height: 60vh; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  header div { display: flex; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  h2 { margin: 18px 0 4px; font-size: 18px; }
  button, a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 14px;
    font: inherit; font-weight: 700; color: #fff; background: var(--red); border: 0; border-radius: 6px;
    text-decoration: none; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.quiet, a.btn.quiet { color: var(--ink); background: transparent; border: 1.5px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .grid button { flex-direction: column; min-height: 84px; font-size: 20px; color: var(--ink); background: #fff; border: 1.5px solid var(--line); }
  .grid button small { font-size: 14px; font-weight: 600; }
  .grid button.busy { color: #fff; background: var(--red); border-color: var(--red); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .chips button { white-space: nowrap; }
  .chips button.on { color: #fff; background: var(--night); border-color: var(--night); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .nm small { display: block; color: var(--muted); }
  .nm button { min-height: 36px; margin-top: 6px; padding: 0 10px; font-size: 15px; }
  .sent { color: var(--muted); }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { min-width: 44px; padding: 0; }
  .off { color: var(--muted); text-decoration: line-through; }
  .muted { color: var(--muted); }
  .menu { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: start; }
  .cats { position: sticky; top: 8px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 80px); overflow-y: auto; }
  .cats button { justify-content: flex-start; min-height: 52px; padding: 8px 10px; font-size: 16px; text-align: left; white-space: normal; overflow-wrap: anywhere; }
  .cats button.on { color: #fff; background: var(--night); border-color: var(--night); }
  .items .row:first-child { padding-top: 0; border-top: 0; }
  #modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; padding: 12px; background: rgba(10, 15, 30, 0.7); }
  #modal .card { width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; padding: 20px 16px; background: var(--paper); border-radius: 10px; }
  #modal h2 { margin: 0 0 8px; }
  #modal p { margin: 0 0 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .seg button.on { color: #fff; background: var(--night); border-color: var(--night); }
  .check { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-weight: 600; }
  .check input { width: 24px; height: 24px; }
  .wide { display: flex; width: 100%; margin-top: 8px; }
#printArea { display: none; }
  @media print {
    body { padding: 0; background: #fff; color: #000; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; max-width: 420px; margin: 0 auto; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #printArea h1 { margin: 0 0 4px; font-size: 22px; }
    #printArea p { margin: 0 0 4px; }
    #printArea table { width: 100%; margin-top: 10px; border-collapse: collapse; }
    #printArea td { padding: 4px 0; border-bottom: 1px solid #ddd; }
    #printArea td.n { padding-left: 12px; text-align: right; white-space: nowrap; }
    #printArea tr.sub td { padding-top: 0; font-size: 13px; color: #444; }
    #printArea tr.total td { font-size: 18px; font-weight: 700; border-bottom: 0; border-top: 2px solid #000; }
    #printArea .fine { margin-top: 16px; font-size: 12px; text-align: center; color: #444; }
  }
  input[type="search"] { width: 100%; min-height: 46px; margin: 0 0 10px; padding: 8px 10px; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 6px; }
  .tlist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .tlist button { justify-content: flex-start; text-align: left; }
  .pair { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--night); }
  #bar button { display: flex; width: 100%; max-width: 640px; min-height: 54px; margin: 0 auto; }
  :focus-visible { outline: 3px solid var(--night); outline-offset: 2px; }
</style>
</head>
<body>
<main id="page" hidden><section id="view"></section></main>
<div id="bar" hidden></div>
<div id="modal" hidden></div>
<div id="printArea"></div>

<script type="module">
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, doc, getDoc, addDoc, onSnapshot, query, where, writeBatch, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { auth, db } from "./firebase.js";

  const $ = (id) => document.getElementById(id);
  const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  const money = (n) => Number(n || 0).toFixed(2).replace(".", ",") + " €";
  const byName = (a, b) => a.name.localeCompare(b.name, "el", { numeric: true });
  const sum = (items) => Math.round(items.reduce((s, l) => s + l.price * l.qty, 0) * 100) / 100;

  const st = { me: null, tables: [], categories: [], items: [], orders: [] };
  let view = { name: "tables" };
  const openOrder = (t) => st.orders.find((o) => o.tableId === t.id);
  const go = (v) => { view = v; render(); };

  const extrasText = (ex) => ex.map((e) => (e.qty > 1 ? e.qty + "x " : "") + e.name).join(", ");

  function addLine(i, extras) {
    const key = i.id + "|" + extras.map((e) => e.name + "x" + e.qty).join(",");
    const unit = Math.round((i.price + extras.reduce((s, e) => s + e.price * e.qty, 0)) * 100) / 100;
    const l = view.cart.find((x) => x.key === key && !x.note);
    if (l) l.qty++;
    else view.cart.push({ key, id: i.id, name: i.name, price: unit, qty: 1, note: "", extras, cat: (st.categories.find((c) => c.id === i.categoryId) || {}).name || "" });
    render();
  }

  function extrasChooser(i, onDone) {
    const modal = $("modal");
    const counts = i.extras.map(() => 0);
    const add = h("button", { className: "wide" });
    const refresh = () => { add.textContent = "Προσθήκη · " + money(i.price + i.extras.reduce((s, e, k) => s + e.price * counts[k], 0)); };
    const rows = i.extras.map((e, k) => {
      const n = h("b", { textContent: "0" });
      const bump = (d) => { counts[k] = Math.max(0, counts[k] + d); n.textContent = String(counts[k]); refresh(); };
      return h("div", { className: "row" },
        h("div", { className: "nm" }, e.name, h("small", { textContent: e.price ? "+" + money(e.price) : "Δωρεάν" })),
        h("div", { className: "qty" },
          h("button", { className: "quiet", textContent: "−", onclick: () => bump(-1) }), n,
          h("button", { textContent: "+", onclick: () => bump(1) })));
    });
    add.onclick = () => {
      modal.hidden = true;
      onDone(i.extras.map((e, k) => ({ name: e.name, price: e.price, qty: counts[k] })).filter((e) => e.qty > 0));
    };
    refresh();
    modal.replaceChildren(h("div", { className: "card" },
      h("h2", { textContent: i.name }), ...rows, add,
      h("button", { className: "quiet wide", textContent: "Άκυρο", onclick: () => { modal.hidden = true; } })));
    modal.hidden = false;
  }

  function tablesView() {
    $("bar").hidden = true;
    const tools = h("div", {},
      ...(st.me.role === "admin" ? [h("a", { className: "btn quiet", href: "admin.html", textContent: "Διαχείριση" })] : []),
      h("button", { className: "quiet", textContent: "Αποσύνδεση", onclick: () => signOut(auth) }));
    const tables = [...st.tables].sort(byName);
    return [
      h("header", {}, h("h1", { textContent: "Τραπέζια" }), tools),
      tables.length
        ? h("div", { className: "grid" }, ...tables.map((t) => {
            const o = openOrder(t);
            return h("button", { className: o ? "busy" : "", onclick: () => go({ name: "order", tableId: t.id, catId: null, cart: [] }) },
              t.name, h("small", { textContent: o ? money(o.total) : "Ελεύθερο" }));
          }))
        : h("p", { className: "muted", textContent: "Δεν υπάρχουν τραπέζια. Πρόσθεσέ τα από τη Διαχείριση." })
    ];
  }

  function orderView() {
    const t = st.tables.find((x) => x.id === view.tableId);
    if (!t) { view = { name: "tables" }; return tablesView(); }
    const o = openOrder(t);
    const cart = view.cart;
    const cats = [...st.categories].sort((a, b) => a.order - b.order);
    if (!view.catId && cats.length) view.catId = cats[0].id;

    const out = [h("header", {}, h("h1", { textContent: t.name }), h("button", { className: "quiet", textContent: "Πίσω", onclick: () => go({ name: "tables" }) }))];

    if (o) {
      out.push(h("h2", { textContent: "Έχουν σταλεί · " + money(o.total) }));
      for (const l of o.items) {
        out.push(h("div", { className: "row sent" },
          h("div", { className: "nm", textContent: l.qty + "× " + l.name + (l.extras && l.extras.length ? " + " + extrasText(l.extras) : "") + (l.note ? " (" + l.note + ")" : "") }),
          h("span", { textContent: money(l.price * l.qty) })));
      }
      out.push(h("div", { className: "pair" },
        h("button", { className: "quiet", textContent: "Λογαριασμός", onclick: () => billDialog(t, o) }),
        h("button", { className: "quiet", textContent: "Επανεκτύπωση", onclick: (e) => reprint(t, o, e.target) }),
        h("button", { className: "quiet", textContent: "Μεταφορά", onclick: () => moveDialog(t, o) }),
        h("button", { className: "quiet", textContent: "Χωρισμός", onclick: () => go({ name: "split", tableId: t.id, back: view, tab: "items", picks: [], method: null, print: false, n: 2, methods: ["cash", "cash"] }) }),
        h("button", { className: "quiet", textContent: "Κλείσιμο τραπεζιού", onclick: () => closeDialog(t, o) })));
    }

    out.push(h("h2", { textContent: "Νέα παραγγελία" }));
    const catCol = h("div", { className: "cats" }, ...cats.map((c) =>
      h("button", { className: "quiet" + (c.id === view.catId ? " on" : ""), textContent: c.name, onclick: () => { view.catId = c.id; view.q = ""; render(); } })));
    const itemCol = h("div", { className: "items" });
    const norm = (v) => String(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const fillItems = () => {
      const q = norm(view.q || "").trim();
      const list = (q ? st.items.filter((x) => norm(x.name).includes(q)) : st.items.filter((x) => x.categoryId === view.catId)).sort(byName);
      itemCol.replaceChildren(...list.map((i) => {
        const off = i.available === false;
        return h("div", { className: "row" },
          h("div", { className: "nm" }, h("span", { className: off ? "off" : "", textContent: i.name }), h("small", { textContent: off ? "Εξαντλήθηκε" : money(i.price) })),
          h("button", { textContent: "+", disabled: off, onclick: () => (i.extras && i.extras.length ? extrasChooser(i, (ex) => addLine(i, ex)) : addLine(i, [])) }));
      }), ...(list.length ? [] : [h("p", { className: "muted", textContent: "Κανένα προϊόν." })]));
    };
    fillItems();
    const search = h("input", { type: "search", placeholder: "Αναζήτηση προϊόντος…", value: view.q || "", oninput: (e) => { view.q = e.target.value; fillItems(); } });
    out.push(search, h("div", { className: "menu" }, catCol, itemCol));

    if (cart.length) {
      out.push(h("h2", { textContent: "Στο καλάθι" }));
      for (const l of cart) {
        out.push(h("div", { className: "row" },
          h("div", { className: "nm" }, l.name, l.extras && l.extras.length ? h("small", { textContent: "+ " + extrasText(l.extras) }) : "", l.note ? h("small", { textContent: l.note }) : "",
            h("button", { className: "quiet", textContent: l.note ? "Αλλαγή σημείωσης" : "Σημείωση", onclick: () => {
              const n = prompt("Σημείωση (π.χ. χωρίς κρεμμύδι)", l.note || "");
              if (n !== null) { l.note = n.trim(); render(); }
            } })),
          h("div", { className: "qty" },
            h("button", { className: "quiet", textContent: "−", onclick: () => { l.qty--; if (l.qty <= 0) cart.splice(cart.indexOf(l), 1); render(); } }),
            h("b", { textContent: String(l.qty) }),
            h("button", { textContent: "+", onclick: () => { l.qty++; render(); } }))));
      }
    }

    const bar = $("bar");
    bar.hidden = !cart.length;
    bar.replaceChildren(h("button", { textContent: "Αποστολή στην κουζίνα · " + money(sum(cart)), onclick: (e) => send(t, o, e.target) }));
    return out;
  }

  async function send(t, o, button) {
    const cart = view.cart;
    if (!cart.length) return;
    button.disabled = true;
    button.textContent = "Αποστολή…";
    const items = [...(o ? o.items : []), ...cart.map(({ name, price, qty, note, cat, extras }) => ({ name, price, qty, note, cat: cat || "", extras: extras || [] }))];
    const lines = cart.map(({ qty, name, note, extras }) => ({ qty, name, note: [extras && extras.length ? "+ " + extrasText(extras) : "", note].filter(Boolean).join(" | ") }));
    const ref = o ? doc(db, "orders", o.id) : doc(collection(db, "orders"));
    const b = writeBatch(db);
    if (o) b.update(ref, { items, total: sum(items), lastLines: lines });
    else b.set(ref, { items, total: sum(items), tableId: t.id, tableName: t.name, waiterId: st.me.uid, waiterName: st.me.name, status: "open", lastLines: lines, createdAt: serverTimestamp() });
    b.update(doc(db, "tables", t.id), { status: "busy", orderId: ref.id });
    b.set(doc(collection(db, "printJobs")), {
      orderId: ref.id, tableName: t.name, waiterName: st.me.name, status: "pending", createdAt: serverTimestamp(),
      lines
    });
    try { await b.commit(); go({ name: "tables" }); }
    catch (e) { alert("Η παραγγελία δεν στάλθηκε: " + (e.code || e.message)); render(); }
  }

  async function reprint(t, o, button) {
    if (!confirm("Επανεκτύπωση του τελευταίου δελτίου;")) return;
    button.disabled = true;
    try {
      await addDoc(collection(db, "printJobs"), {
        orderId: o.id, tableName: t.name, waiterName: "ΕΠΑΝΕΚΤΥΠΩΣΗ - " + st.me.name, reprint: true,
        status: "pending", createdAt: serverTimestamp(),
        lines: o.lastLines || o.items.map(({ qty, name, note }) => ({ qty, name, note }))
      });
      alert("Στάλθηκε για εκτύπωση.");
    } catch (e) { alert("Κάτι πήγε στραβά: " + (e.code || e.message)); }
    button.disabled = false;
  }

  const billJob = (t, o, payment) => ({
    type: "bill", orderId: o.id, tableName: t.name, waiterName: o.waiterName || st.me.name,
    status: "receipt", createdAt: serverTimestamp(), total: o.total, payment: payment || null,
    items: o.items.map(({ qty, name, price, note, extras }) => ({ qty, name, price, note: note || "", extras: extras || [] }))
  });

  async function printBill(t, o, button) {
    button.disabled = true;
    try {
      await addDoc(collection(db, "printJobs"), billJob(t, o));
      alert("Ο λογαριασμός στάλθηκε για εκτύπωση.");
    } catch (e) { alert("Κάτι πήγε στραβά: " + (e.code || e.message)); }
    button.disabled = false;
  }

  const stampNow = () => new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Athens", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date()).replace(",", "");

  function fillBillPrint(t, o) {
    const rows = [];
    for (const l of o.items) {
      rows.push(h("tr", {}, h("td", { textContent: l.qty + "× " + l.name }), h("td", { className: "n", textContent: money(l.price * l.qty) })));
      const sub = [l.extras && l.extras.length ? "+ " + extrasText(l.extras) : "", l.note].filter(Boolean).join(" · ");
      if (sub) rows.push(h("tr", { className: "sub" }, h("td", { colSpan: 2, textContent: sub })));
    }
    rows.push(h("tr", { className: "total" }, h("td", { textContent: "ΣΥΝΟΛΟ" }), h("td", { className: "n", textContent: money(o.total) })));
    $("printArea").replaceChildren(
      h("h1", { textContent: "Platea Fast Food" }),
      h("p", { textContent: "Λογαριασμός · Τραπέζι " + t.name + " · " + stampNow() }),
      h("p", { textContent: "Σερβιτόρος: " + (o.waiterName || "") }),
      h("table", {}, ...rows),
      h("p", { className: "fine", textContent: "Δεν αποτελεί φορολογικό παραστατικό." }));
  }

  function billDialog(t, o) {
    const modal = $("modal");
    modal.replaceChildren(h("div", { className: "card" },
      h("h2", { textContent: "Λογαριασμός · " + money(o.total) }),
      h("button", { className: "wide", textContent: "Εκτύπωση στον εκτυπωτή", onclick: async (e) => { await printBill(t, o, e.target); modal.hidden = true; } }),
      h("button", { className: "quiet wide", textContent: "Αποθήκευση PDF", onclick: () => { modal.hidden = true; fillBillPrint(t, o); window.print(); } }),
      h("button", { className: "quiet wide", textContent: "Άκυρο", onclick: () => { modal.hidden = true; } })));
    modal.hidden = false;
  }

  function moveDialog(t, o) {
    const modal = $("modal");
    const rows = st.tables.filter((x) => x.id !== t.id).sort(byName).map((x) => {
      const target = openOrder(x);
      return h("button", { className: target ? "quiet" : "", textContent: x.name + (target ? " · συγχώνευση (" + money(target.total) + ")" : " · ελεύθερο"), onclick: () => moveOrder(t, o, x, target) });
    });
    modal.replaceChildren(h("div", { className: "card" },
      h("h2", { textContent: "Τραπέζι " + t.name + " → ;" }),
      h("p", { className: "muted", textContent: "Διάλεξε τραπέζι. Αν έχει ήδη παραγγελία, οι δύο παραγγελίες ενώνονται." }),
      h("div", { className: "tlist" }, ...rows),
      h("button", { className: "quiet wide", textContent: "Άκυρο", onclick: () => { modal.hidden = true; } })));
    modal.hidden = false;
  }

  async function moveOrder(t, o, x, target) {
    if (!confirm((target ? "Συγχώνευση του τραπεζιού " : "Μεταφορά του τραπεζιού ") + t.name + " στο " + x.name + ";")) return;
    const b = writeBatch(db);
    b.update(doc(db, "tables", t.id), { status: "free", orderId: null });
    if (target) {
      const items = [...target.items, ...o.items];
      b.update(doc(db, "orders", target.id), { items, total: sum(items) });
      b.update(doc(db, "orders", o.id), { status: "merged", mergedInto: target.id });
    } else {
      b.update(doc(db, "orders", o.id), { tableId: x.id, tableName: x.name });
      b.update(doc(db, "tables", x.id), { status: "busy", orderId: o.id });
    }
    try { await b.commit(); $("modal").hidden = true; go({ name: "tables" }); }
    catch (e) { alert("Κάτι πήγε στραβά: " + (e.code || e.message)); }
  }

  const splitShares = (total, n) => {
    const out = []; let acc = 0;
    for (let k = 0; k < n; k++) {
      const s = k < n - 1 ? Math.round((total / n) * 100) / 100 : Math.round((total - acc) * 100) / 100;
      out.push(s); acc = Math.round((acc + s) * 100) / 100;
    }
    return out;
  };

  const paidOrder = (t, o, items, total, payment) => ({
    items, total, tableId: t.id, tableName: t.name, waiterId: o.waiterId, waiterName: o.waiterName,
    status: "paid", payment, splitOf: o.id, createdAt: serverTimestamp(), closedAt: serverTimestamp()
  });

  async function payPart(t, o, picks, method, printIt) {
    const lines = [], rest = [];
    o.items.forEach((l, i) => {
      const q = picks[i] || 0;
      if (q > 0) lines.push({ ...l, qty: q });
      if (q < l.qty) rest.push({ ...l, qty: l.qty - q });
    });
    const part = sum(lines);
    const b = writeBatch(db);
    b.set(doc(collection(db, "orders")), paidOrder(t, o, lines, part, method));
    if (rest.length) b.update(doc(db, "orders", o.id), { items: rest, total: sum(rest) });
    else {
      b.update(doc(db, "orders", o.id), { items: [], total: 0, status: "paid", payment: method, closedAt: serverTimestamp() });
      b.update(doc(db, "tables", t.id), { status: "free", orderId: null });
    }
    if (printIt) b.set(doc(collection(db, "printJobs")), billJob(t, { id: o.id, waiterName: o.waiterName, items: lines, total: part }, method));
    try {
      await b.commit();
      view.picks = []; view.print = false; view.method = null;
      if (rest.length) render(); else go({ name: "tables" });
    } catch (e) { alert("Κάτι πήγε στραβά: " + (e.code || e.message)); render(); }
  }

  async function payEqual(t, o, n, methods, printIt) {
    const shares = splitShares(o.total, n);
    const b = writeBatch(db);
    for (let k = 0; k < n; k++) {
      const f = o.total ? shares[k] / o.total : 0;
      const lines = o.items.map((l) => ({ ...l, qty: Math.round(l.qty * f * 1000) / 1000 }));
      b.set(doc(collection(db, "orders")), paidOrder(t, o, lines, shares[k], methods[k]));
      if (printIt) {
        const one = [{ qty: 1, name: "Μερίδα " + (k + 1) + "/" + n, price: shares[k], note: "", extras: [] }];
        b.set(doc(collection(db, "printJobs")), billJob(t, { id: o.id, waiterName: o.waiterName, items: one, total: shares[k] }, methods[k]));
      }
    }
    b.update(doc(db, "orders", o.id), { items: [], total: 0, status: "paid", payment: "split", closedAt: serverTimestamp() });
    b.update(doc(db, "tables", t.id), { status: "free", orderId: null });
    try { await b.commit(); go({ name: "tables" }); }
    catch (e) { alert("Κάτι πήγε στραβά: " + (e.code || e.message)); render(); }
  }

  function splitView() {
    $("bar").hidden = true;
    const t = st.tables.find((x) => x.id === view.tableId);
    const o = t && openOrder(t);
    if (!o) { view = { name: "tables" }; return tablesView(); }
    const back = view.back;
    const seg = (current, onPick) => h("div", { className: "seg" }, ...[["cash", "Μετρητά"], ["card", "Κάρτα"]].map(([k, label]) =>
      h("button", { className: "quiet" + (current === k ? " on" : ""), textContent: label, onclick: () => onPick(k) })));
    const printBox = h("label", { className: "check" },
      h("input", { type: "checkbox", checked: view.print, onchange: (e) => { view.print = e.target.checked; } }),
      view.tab === "equal" ? "Εκτύπωση λογαριασμού για κάθε άτομο" : "Εκτύπωση λογαριασμού για αυτό το μέρος");
    const tabs = h("div", { className: "seg" }, ...[["items", "Ανά προϊόν"], ["equal", "Ίσο μοίρασμα"]].map(([k, label]) =>
      h("button", { className: "quiet" + (view.tab === k ? " on" : ""), textContent: label, onclick: () => { view.tab = k; render(); } })));
    const out = [
      h("header", {}, h("h1", { textContent: "Χωρισμός · " + t.name }), h("button", { className: "quiet", textContent: "Πίσω", onclick: () => go(back) })),
      h("p", { className: "muted", textContent: "Υπόλοιπο: " + money(o.total) }),
      tabs
    ];

    if (view.tab === "items") {
      const sel = Math.round(o.items.reduce((s, l, i) => s + l.price * (view.picks[i] || 0), 0) * 100) / 100;
      const all = o.items.every((l, i) => (view.picks[i] || 0) === l.qty);
      out.push(h("button", { className: "quiet", textContent: "Επιλογή όλων", onclick: () => { view.picks = o.items.map((l) => l.qty); render(); } }));
      o.items.forEach((l, i) => {
        const n = view.picks[i] || 0;
        const bump = (d) => { view.picks[i] = Math.max(0, Math.min(l.qty, n + d)); render(); };
        out.push(h("div", { className: "row" },
          h("div", { className: "nm" }, l.qty + "× " + l.name,
            h("small", { textContent: money(l.price) + " / τεμ." + (l.extras && l.extras.length ? " · + " + extrasText(l.extras) : "") })),
          h("div", { className: "qty" },
            h("button", { className: "quiet", textContent: "−", onclick: () => bump(-1) }),
            h("b", { textContent: String(n) }),
            h("button", { textContent: "+", onclick: () => bump(1) }))));
      });
      out.push(h("h2", { textContent: "Πληρωμή" }), seg(view.method, (k) => { view.method = k; render(); }), printBox,
        h("button", { className: "wide", disabled: !sel || !view.method, textContent: (all ? "Πληρωμή και κλείσιμο · " : "Πληρωμή μέρους · ") + money(sel),
          onclick: (e) => { e.target.disabled = true; payPart(t, o, view.picks, view.method, view.print); } }));
    } else {
      const n = view.n;
      while (view.methods.length < n) view.methods.push("cash");
      const shares = splitShares(o.total, n);
      out.push(h("div", { className: "row" }, h("b", { textContent: "Άτομα" }),
        h("div", { className: "qty" },
          h("button", { className: "quiet", textContent: "−", onclick: () => { view.n = Math.max(2, n - 1); render(); } }),
          h("b", { textContent: String(n) }),
          h("button", { textContent: "+", onclick: () => { view.n = Math.min(12, n + 1); render(); } }))));
      for (let k = 0; k < n; k++) {
        out.push(h("div", { className: "row" },
          h("div", { className: "nm" }, "Άτομο " + (k + 1), h("small", { textContent: money(shares[k]) })),
          h("button", { className: "quiet", textContent: view.methods[k] === "card" ? "Κάρτα" : "Μετρητά",
            onclick: () => { view.methods[k] = view.methods[k] === "card" ? "cash" : "card"; render(); } })));
      }
      out.push(printBox, h("button", { className: "wide", textContent: "Πληρωμή και κλείσιμο · " + money(o.total),
        onclick: (e) => { e.target.disabled = true; payEqual(t, o, n, view.methods.slice(0, n), view.print); } }));
    }
    return out;
  }

  function closeDialog(t, o) {
    const modal = $("modal");
    let method = null;
    const done = h("button", { className: "wide", textContent: "Κλείσιμο τραπεζιού", disabled: true });
    const seg = h("div", { className: "seg" });
    const btns = {};
    for (const [key, label] of [["cash", "Μετρητά"], ["card", "Κάρτα"]]) {
      btns[key] = h("button", { className: "quiet", textContent: label, onclick: () => {
        method = key; done.disabled = false;
        for (const k in btns) btns[k].classList.toggle("on", k === key);
      } });
      seg.append(btns[key]);
    }
    const bill = h("input", { type: "checkbox" });
    done.onclick = async () => {
      done.disabled = true;
      const b = writeBatch(db);
      b.update(doc(db, "orders", o.id), { status: "paid", payment: method, closedAt: serverTimestamp() });
      b.update(doc(db, "tables", t.id), { status: "free", orderId: null });
      if (bill.checked) b.set(doc(collection(db, "printJobs")), billJob(t, o, method));
      try { await b.commit(); modal.hidden = true; go({ name: "tables" }); }
      catch (e) { alert("Κάτι πήγε στραβά: " + (e.code || e.message)); done.disabled = false; }
    };
    modal.replaceChildren(h("div", { className: "card" },
      h("h2", { textContent: "Τραπέζι " + t.name + " · " + money(o.total) }),
      h("p", { className: "muted", textContent: "Τρόπος πληρωμής" }),
      seg,
      h("label", { className: "check" }, bill, "Εκτύπωση λογαριασμού"),
      done,
      h("button", { className: "quiet wide", textContent: "Άκυρο", onclick: () => { modal.hidden = true; } })));
    modal.hidden = false;
  }

  function render() { $("view").replaceChildren(...(view.name === "order" ? orderView() : view.name === "split" ? splitView() : tablesView())); }

  onAuthStateChanged(auth, async (user) => {
    if (!user) return location.replace("index.html");
    try {
      const p = (await getDoc(doc(db, "users", user.uid))).data();
      if (!p || p.active !== true || !["admin", "waiter"].includes(p.role)) throw new Error("no-access");
      st.me = { uid: user.uid, name: p.name, role: p.role };
    } catch (e) {
      alert("Δεν έχεις πρόσβαση σε αυτή τη σελίδα.");
      return location.replace("index.html");
    }
    const sub = (key, q) => onSnapshot(q, (s) => {
      st[key] = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    }, (e) => { if (auth.currentUser) console.error(e); });
    sub("tables", collection(db, "tables"));
    sub("categories", collection(db, "categories"));
    sub("items", collection(db, "menuItems"));
    sub("orders", query(collection(db, "orders"), where("status", "==", "open")));
    $("page").hidden = false;
  });
</script>
</body>
</html>
